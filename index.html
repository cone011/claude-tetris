<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <h1 class="game-title">TETRIS</h1>
      <label class="theme-toggle" title="Cambiar tema claro/oscuro">
        <input type="checkbox" id="theme-switch" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="name-entry" class="name-entry hidden">
          <p class="name-entry-label">¡Nuevo récord! Ingresa tu nombre:</p>
          <input type="text" id="player-name-input" maxlength="12" placeholder="Nombre" autocomplete="off" />
          <button id="save-score-btn">Guardar</button>
        </div>

        <div id="overlay-scores-panel" class="scores-panel hidden">
          <p class="scores-title">TOP 5</p>
          <ol id="overlay-scores-list" class="scores-list"></ol>
        </div>

        <button id="restart-btn">Reiniciar</button>
        <button id="reset-records-btn-overlay" class="secondary-btn hidden">Borrar records</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box start-box">
        <p id="start-title">TETRIS</p>

        <div class="stats-row">
          <div class="stat-item">
            <span class="label">MEJOR COMBO</span>
            <span class="value" id="start-best-combo">0</span>
          </div>
          <div class="stat-item">
            <span class="label">LÍNEAS MÁXIMAS</span>
            <span class="value" id="start-max-lines">0</span>
          </div>
        </div>

        <div class="scores-panel">
          <p class="scores-title">TOP 5</p>
          <ol id="start-scores-list" class="scores-list"></ol>
        </div>

        <button id="play-btn">Jugar</button>
        <button id="reset-records-btn" class="secondary-btn">Borrar records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
